<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday, My Love — Interactive Lyric Keepsake</title>

  <!-- Open Graph tags for link preview -->
  <meta property="og:title" content="For You, On Your Birthday ✨" />
  <meta property="og:description" content="Open this little book, turn up your sound, and read along." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Playfair Display (titles), Lora (lyrics), Caveat (handwritten Polaroid notes) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- StPageFlip library for 3D hardcover & paper page-turn physics -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="ambient-glow"></div>

  <!-- Top Bar -->
  <header
    class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 sm:px-6 py-3 pointer-events-none">
    <div class="pointer-events-auto flex items-center gap-2 text-xs sm:text-sm text-[#e8d8c8]/80">
      <span class="inline-block w-2 h-2 rounded-full bg-[#dfc078] animate-pulse"></span>
      <span class="font-display italic tracking-wide hidden sm:inline">For My Dearest Lover</span>
    </div>

    <div class="pointer-events-auto flex items-center gap-2">
      <button id="prevPageBtn" type="button" title="Previous Page (Left Arrow)"
        class="px-2.5 py-1.5 rounded-full text-xs bg-white/5 hover:bg-white/15 border border-white/10 text-[#f3e6d8] transition flex items-center gap-1">
        <span>‹</span>
        <span class="hidden md:inline">Prev</span>
      </button>
      <button id="nextPageBtn" type="button" title="Next Page (Right Arrow)"
        class="px-2.5 py-1.5 rounded-full text-xs bg-white/5 hover:bg-white/15 border border-white/10 text-[#f3e6d8] transition flex items-center gap-1">
        <span class="hidden md:inline">Next</span>
        <span>›</span>
      </button>

    </div>
  </header>

  <!-- Main Book Stage -->
  <main class="book-stage">
    <div id="bookWrapper" class="book-wrapper">
      <div id="flipbook"></div>
    </div>

    <p id="bookHint" class="mt-4 text-xs text-[#e8d8c8]/60 text-center tracking-wide">
      Click the cover button to begin • Click page corners or use ← / → keys anytime
    </p>
  </main>

  <!-- Floating Bottom Audio & Sync Control Dock -->
  <footer class="fixed bottom-3 sm:bottom-5 left-0 right-0 z-30 px-3 sm:px-6 flex justify-center pointer-events-none">
    <div
      class="player-dock pointer-events-auto w-full max-w-2xl rounded-2xl px-3.5 sm:px-5 py-2.5 sm:py-3 flex flex-col gap-2">
      <div class="flex items-center justify-between gap-3">
        <!-- Play / Pause Button -->
        <button id="playPauseBtn" type="button" aria-label="Play or Pause"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br from-[#e7cb83] to-[#c49a45] text-[#281017] flex items-center justify-center shrink-0 shadow-md hover:brightness-105 active:scale-95 transition">
          <svg id="playIcon" class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg id="pauseIcon" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>

        <!-- Track Title & Scrubber -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between text-[11px] sm:text-xs text-[#e9d8c7]/80 mb-1">
            <span id="audioSourceLabel" class="truncate font-medium text-[#f5e3b3]">
              ♪ Built-in Music Box Melody (Demo)
            </span>
            <span id="timeDisplay" class="tabular-nums shrink-0 ml-2 text-[#e9d8c7]/70">
              0:00 / 0:36
            </span>
          </div>

          <div class="relative flex items-center">
            <input id="progressSlider" type="range" min="0" max="36" step="0.1" value="0" aria-label="Song progress"
              class="scrubber w-full" />
          </div>
        </div>

        <!-- Auto-Sync Toggle Pill & Spread Counter -->
        <div class="flex items-center gap-2 shrink-0">
          <button id="autoSyncToggle" type="button" title="Toggle automatic page turning with the music"
            class="px-2.5 py-1.5 rounded-full text-[11px] font-medium border transition flex items-center gap-1.5 bg-[#dfc078]/20 border-[#dfc078]/50 text-[#f7e5b4]">
            <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-[#dfc078]"></span>
            <span>Auto-Flip: <strong id="syncStateText">ON</strong></span>
          </button>

          <span id="spreadBadge"
            class="hidden sm:inline-block px-2.5 py-1 rounded-full text-[11px] bg-white/5 border border-white/10 text-[#e8d8c8]/75 tabular-nums">
            Cover
          </span>
        </div>
      </div>
    </div>
  </footer>

  <!-- Fullscreen Flower Shower Overlay -->
  <div id="flowerOverlay" class="flower-overlay">
    <button id="closeOverlayBtn" type="button"
      class="overlay-close-btn px-5 py-2.5 rounded-full bg-white/15 hover:bg-white/25 border border-white/30 text-[#f7efe6] text-xs sm:text-sm backdrop-blur-md shadow-lg transition">
      ✕
    </button>
  </div>

  <!-- Hidden HTML5 Audio Element -->
  <audio id="songAudio" preload="metadata"></audio>

  <!-- External Script -->
  <script src="script.js"></script>
</body>

</html>
